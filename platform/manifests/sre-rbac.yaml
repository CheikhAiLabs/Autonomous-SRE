apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-controller
  namespace: sre-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autonomous-remediator
  namespace: demo
rules:
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - replicasets
      - statefulsets
      - statefulsets/scale
      - daemonsets
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autonomous-remediator
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: remediation-controller
    namespace: sre-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: autonomous-remediator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: autonomous-sre-node-remediator
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autonomous-sre-node-remediator
subjects:
  - kind: ServiceAccount
    name: remediation-controller
    namespace: sre-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: autonomous-sre-node-remediator
