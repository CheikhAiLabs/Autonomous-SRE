apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-controller
  namespace: sre-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: autonomous-remediator
  namespace: demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: autonomous-remediator
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: remediation-controller
    namespace: sre-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: autonomous-remediator
