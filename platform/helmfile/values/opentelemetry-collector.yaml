mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: true
  kubeletMetrics:
    enabled: true
config:
  exporters:
    otlp_http/tempo:
      endpoint: http://tempo.observability.svc:4318
    otlp_http/loki:
      endpoint: http://loki.observability.svc:3100/otlp
    debug:
      verbosity: basic
  service:
    pipelines:
      logs:
        receivers: [file_log]
        processors: [k8s_attributes, batch]
        exporters: [otlp_http/loki]
      traces:
        receivers: [otlp]
        processors: [k8s_attributes, batch]
        exporters: [otlp_http/tempo]
