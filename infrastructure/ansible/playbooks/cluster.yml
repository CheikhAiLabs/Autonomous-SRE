---
- name: Prepare all Kubernetes nodes
  hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - common

- name: Install K3s control plane
  hosts: control_plane
  become: true
  gather_facts: true
  roles:
    - k3s_server

- name: Install K3s workers
  hosts: workers
  become: true
  gather_facts: true
  roles:
    - k3s_agent
