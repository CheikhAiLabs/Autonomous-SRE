---
- name: Install K3s agent
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      K3S_URL="https://{{ hostvars[groups['control_plane'][0]].private_ip }}:6443" \
      K3S_TOKEN="{{ hostvars[groups['control_plane'][0]].k3s_token }}" \
      sh -s - agent \
      --node-ip="{{ private_ip }}" \
      --node-label=autonomous-sre/role=worker
  args:
    executable: /bin/bash
  changed_when: false

- name: Ensure K3s agent is running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
