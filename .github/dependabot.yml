version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /apps/dashboard
    schedule: {interval: weekly}
    groups:
      dashboard:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      python:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /apps/api
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /apps/worker
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /apps/controller
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /apps/dashboard
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /workloads/demo-service
    schedule: {interval: weekly}
