name: Build Images

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare-pool:
    name: Prepare build runner pool
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ vars.RUNNER_ONLINE == 'true' && 'autonomous-sre' || 'ubuntu-latest' }}
    environment: production
    concurrency: autonomous-sre-build-pool
    outputs:
      pool_ready: ${{ steps.pool.outputs.pool_ready }}
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2.0.2
        if: vars.RUNNER_ONLINE == 'true'
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Provision or reuse Scaleway build runners
        id: pool
        if: vars.RUNNER_ONLINE == 'true'
        shell: bash
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_REGION: ${{ vars.SCW_REGION }}
          SCW_ZONE: ${{ vars.SCW_ZONE }}
          RUNNER_CIDR: ${{ vars.RUNNER_CIDR }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          BUILD_RUNNER_COUNT: '3'
          BUILD_RUNNER_TYPE: DEV1-M
        run: |
          set -Eeuo pipefail
          if [ -z "${RUNNER_ADMIN_TOKEN:-}" ] || [ -z "${DEPLOY_SSH_PRIVATE_KEY:-}" ]; then
            echo "::warning::Ephemeral build-runner credentials are not configured yet; using the primary runner for this build."
            echo "pool_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p config
          cat > config/project.env <<EOF
          SCW_PROJECT_ID=$SCW_PROJECT_ID
          SCW_REGION=$SCW_REGION
          SCW_ZONE=$SCW_ZONE
          OPERATOR_CIDR=$RUNNER_CIDR
          ALERT_EMAIL=${{ vars.ALERT_EMAIL }}
          GITHUB_REPOSITORY=${{ github.repository }}
          CONTROL_PLANE_TYPE=${{ vars.CONTROL_PLANE_TYPE }}
          WORKER_TYPE=${{ vars.WORKER_TYPE }}
          WORKER_COUNT=${{ vars.WORKER_COUNT }}
          RUNNER_TYPE=DEV1-S
          AUTO_REMEDIATION_MODE=${{ vars.AUTO_REMEDIATION_MODE }}
          OLLAMA_MODEL=${{ vars.OLLAMA_MODEL }}
          SMTP_SMARTHOST=${{ vars.SMTP_SMARTHOST }}
          SMTP_USERNAME=${{ vars.SMTP_USERNAME }}
          LETSENCRYPT_EMAIL=${{ vars.LETSENCRYPT_EMAIL }}
          EOF
          cat > config/secrets.env <<EOF
          SMTP_PASSWORD=
          APPROVAL_SIGNING_KEY=not-used-during-build-pool
          POSTGRES_PASSWORD=not-used-during-build-pool
          GHCR_PULL_TOKEN=
          EOF
          chmod 0600 config/secrets.env

          if ./scripts/ensure-build-runners.sh; then
            echo "pool_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Ephemeral build-runner provisioning failed; cleaning partial pool and falling back to the primary runner."
            ./scripts/destroy-build-runners.sh || true
            echo "pool_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub-hosted fallback
        if: vars.RUNNER_ONLINE != 'true'
        run: echo "Dedicated runner is absent; image builds will use GitHub-hosted runners."

      - name: Primary-runner fallback
        if: vars.RUNNER_ONLINE == 'true' && steps.pool.outputs.pool_ready != 'true'
        run: echo "Ephemeral build pool is unavailable; image builds will use the primary Scaleway runner."

  build:
    name: build (${{ matrix.name }}, ${{ matrix.dockerfile }})
    needs: prepare-pool
    runs-on: ${{ needs.prepare-pool.outputs.pool_ready == 'true' && 'autonomous-sre-build' || (vars.RUNNER_ONLINE == 'true' && 'autonomous-sre' || 'ubuntu-latest') }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: sre-api
            dockerfile: apps/api/Dockerfile
          - name: sre-worker
            dockerfile: apps/worker/Dockerfile
          - name: remediation-controller
            dockerfile: apps/controller/Dockerfile
          - name: dashboard
            dockerfile: apps/dashboard/Dockerfile
          - name: demo-service
            dockerfile: workloads/demo-service/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Ensure Docker engine is available
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io
          fi
          sudo systemctl start docker || sudo service docker start
          sudo chmod 0660 /var/run/docker.sock
          if ! docker info >/dev/null 2>&1; then
            sudo chmod 0666 /var/run/docker.sock
          fi
          docker info >/dev/null

      - name: Image metadata
        id: meta
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image=ghcr.io/${repo}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DETECTION_PRIORITY: precise
        with:
          version: v0.74.0
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-files: '**/*.spdx,**/*.spdx.json,**/*.cdx,**/*.cdx.json'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          upload-artifact: true

      - name: Install Cosign
        id: cosign-installer
        continue-on-error: true
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Ensure Cosign is available
        if: steps.cosign-installer.outcome != 'success'
        shell: bash
        env:
          COSIGN_VERSION: v3.0.6
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          asset="cosign-linux-amd64"
          base="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}"
          download_ok=false
          for attempt in $(seq 1 10); do
            echo "Cosign fallback download attempt ${attempt}/10"
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
              "${base}/${asset}" -o "$RUNNER_TEMP/bin/cosign" \
              && curl -fL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
              "${base}/cosign_checksums.txt" -o "$RUNNER_TEMP/cosign_checksums.txt"; then
              expected="$(awk -v f="$asset" '$2 == f {print $1}' "$RUNNER_TEMP/cosign_checksums.txt")"
              actual="$(sha256sum "$RUNNER_TEMP/bin/cosign" | awk '{print $1}')"
              if [ -n "$expected" ] && [ "$expected" = "$actual" ]; then
                chmod +x "$RUNNER_TEMP/bin/cosign"
                download_ok=true
                break
              fi
            fi
            sleep $((attempt * 2))
          done
          if [ "$download_ok" != true ]; then
            echo "Release download unavailable; falling back to verified Go module installation."
            GOBIN="$RUNNER_TEMP/bin" go install github.com/sigstore/cosign/v3/cmd/cosign@${COSIGN_VERSION}
          fi
          "$RUNNER_TEMP/bin/cosign" version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Sign image with keyless Cosign
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  finalize-pool:
    name: Mark build runner pool idle
    if: always() && vars.RUNNER_ONLINE == 'true' && needs.prepare-pool.outputs.pool_ready == 'true'
    needs: [prepare-pool, build]
    runs-on: autonomous-sre
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/finalize-build-runners.sh
