name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Prefer the dedicated Scaleway runner only after bootstrap has confirmed it is
# online. When the runner is intentionally absent, CI falls back to GitHub-hosted
# instead of waiting forever on a deleted VM.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    name: Code and policy quality
    runs-on: ${{ vars.RUNNER_ONLINE == 'true' && 'autonomous-sre' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python tooling
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --dev

      - name: Python compile
        run: python -m compileall -q src apps/api apps/worker apps/controller workloads/demo-service

      - name: Ruff
        run: uv run ruff check src apps/api apps/worker apps/controller tests workloads/demo-service

      - name: Pytest
        run: uv run pytest -q

      - name: Bash syntax and ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck
          fi
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

      - name: Validate YAML
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import yaml
          for p in [*Path('.github/workflows').glob('*.yml'), *Path('platform').rglob('*.yaml')]:
              if p.name.endswith('.yaml.tpl'):
                  continue
              with p.open() as f:
                  list(yaml.safe_load_all(f))
              print(f'validated {p}')
          PY

      - name: Install OPA
        run: |
          curl -fsSL https://openpolicyagent.org/downloads/v1.17.0/opa_linux_amd64_static -o /tmp/opa
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa

      - name: OPA policy tests
        run: opa test platform/policies -v

  opentofu:
    name: OpenTofu validation
    runs-on: ${{ vars.RUNNER_ONLINE == 'true' && 'autonomous-sre' || 'ubuntu-latest' }}
    strategy:
      matrix:
        stack: [opentofu-runner, opentofu-build-runners, opentofu-platform]
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Format check
        run: tofu -chdir=infrastructure/${{ matrix.stack }} fmt -check -recursive
      - name: Init without backend
        run: tofu -chdir=infrastructure/${{ matrix.stack }} init -backend=false -input=false
      - name: Validate
        run: tofu -chdir=infrastructure/${{ matrix.stack }} validate

  dashboard:
    name: Dashboard build
    runs-on: ${{ vars.RUNNER_ONLINE == 'true' && 'autonomous-sre' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        working-directory: apps/dashboard
        run: npm run build
