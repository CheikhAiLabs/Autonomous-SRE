name: Dashboard Selftest

on:
  push:
    branches: [feat/dashboard-intervention-ux]

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: [self-hosted, linux, x64, autonomous-sre]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        working-directory: apps/dashboard
        run: npm run build
