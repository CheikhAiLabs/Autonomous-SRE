name: Dashboard Selftest

on:
  push:
    branches: [feat/dashboard-intervention-ux]

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: [self-hosted, linux, x64, autonomous-sre]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Apply dashboard validation fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/dashboard/src/main.tsx')
          text = path.read_text()
          text = text.replace(
              "events.find(item => item.incident_id === incident.id && item.agent_name === definition.name)",
              "events.filter(item => item.incident_id === incident.id && item.agent_name === definition.name).sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime())[0]",
          )
          text = text.replace(
              "} else if (liveState?.incident_id === incident?.id) {",
              "} else if (liveStateMatchesIncident && liveState) {",
          )
          text = text.replace(
              "  const focusEvents = focusIncident ? activity.filter(item => item.incident_id === focusIncident.id) : []\n",
              "",
          )
          path.write_text(text)
          PY

          if ! git diff --quiet -- apps/dashboard/src/main.tsx; then
            git config user.name 'Cheikh-GPT'
            git config user.email '132473470+Cheikh-GPT@users.noreply.github.com'
            git add apps/dashboard/src/main.tsx
            git commit -m 'fix(dashboard): use latest incident activity safely'
            git push origin HEAD:feat/dashboard-intervention-ux
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        working-directory: apps/dashboard
        run: npm run build
